---
name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and unit tests
    runs-on: &runs-on ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Install the dependencies
        run: npm install

      - name: Lint and check formatting
        run: npx biome ci --reporter=github .

      - name: Type check
        run: npm run typecheck

      - name: Run the unit tests
        run: npm test

      - name: Check the image manifests
        run: npm run tasks -- validate images

      - name: Install shfmt
        run: |-
          sudo apt-get update
          sudo apt-get install --yes shfmt

      - name: Check shell scripts
        run: >-
          shellcheck
          images/src/*/*.sh
          images/test/*.sh
          images/test/*/*.sh
          .claude/hooks/*.sh

      - name: Check shell formatting
        run: >-
          shfmt -d
          images/src
          images/test
          .claude/hooks


  changes:
    name: Check for image changes
    runs-on: *runs-on
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Check whether the pull request could change an image
        id: images
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // A rough pass: ci-images.yml works out which images changed. Keep this a superset of the paths it checks.
            const PATHS = [
              '.github/workflows/',
              '.npmrc',
              '.nvmrc',
              'images/',
              'package.json',
              'schemas/',
              'tasks/',
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const paths = files.flatMap((file) => [file.filename, file.previous_filename].filter(Boolean));

            // The API lists at most 3000 files, so a longer list may be missing changes. Assume an image changed then.
            const truncated = files.length < context.payload.pull_request.changed_files;
            const changed =
              truncated || paths.some((p) => PATHS.some((s) => (s.endsWith('/') ? p.startsWith(s) : p === s)));

            core.info(changed ? 'The pull request could change an image.' : "The pull request doesn't change an image.");
            core.setOutput('images', String(changed));

  images:
    name: Images
    needs:
      - checks
      - changes
    if: needs.changes.outputs.images == 'true'
    # The most any job in ci-images.yml uses. Only its code-review job writes, to post Claude's comments.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ci-images.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
