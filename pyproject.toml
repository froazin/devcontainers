[project]
name = "devcontainers"
version = "0.0.1"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "black>=26.5.1",
    "invoke>=3.0.3",
    "isort>=8.0.1",
    "podman>=5.8.0",
    "pyright>=1.1.411",
    "typing-extensions>=4.16.0",
    "uv>=0.12.5",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = false
exclude-newer = "7 days"
