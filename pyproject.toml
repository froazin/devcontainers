[project]
name = "devcontainers"
version = "0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
exclude-newer = "7 days"
python-downloads = "never"
python-preference = "only-system"

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "-q", "-p", "no:cacheprovider"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
